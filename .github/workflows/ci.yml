name: Integracion Continua (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Obtener codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validar ejecucion del pipeline
      run: |
        echo "Ejecutando pruebas automatizadas..."
        echo "Integración Continua ejecutada con éxito."
